name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LAKE_LOCK: ${{ runner.temp }}/lean-build.lock
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned project toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
          check-reservoir-eligibility: false
      - name: Check required administration configuration and fixtures
        run: python3 tools/verify.py --preflight-only
      - name: Restore exact project artifacts
        id: project-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/build
          key: library-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'LatticeProb.lean', 'LatticeProb/**/*.lean', 'LatticeProbAudit/**/*.lean', 'LatticeProbAudit/**/comparator.json', 'tools/**/*.py', '.github/workflows/*.yml', 'README.md', 'formalization.yaml') }}
      - name: Get dependency cache
        run: /usr/bin/flock "$LAKE_LOCK" lake exe cache get
      - name: Run every required production gate on cache hit and miss
        run: python3 tools/verify.py --evidence-dir "$RUNNER_TEMP/library-verification"
      - name: Save only successfully verified project artifacts
        if: success() && steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/build
          key: library-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'LatticeProb.lean', 'LatticeProb/**/*.lean', 'LatticeProbAudit/**/*.lean', 'LatticeProbAudit/**/comparator.json', 'tools/**/*.py', '.github/workflows/*.yml', 'README.md', 'formalization.yaml') }}
      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-verification
          path: ${{ runner.temp }}/library-verification
          if-no-files-found: error
