name: Comparator audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comparator-${{ github.ref }}
  cancel-in-progress: false
env:
  COMPARATOR_REV: '575674928e239f5bc452aab72d1dd7b0f1326494'
  LEAN4EXPORT_REV: '4e7915201d3f9f04470d9eae002fa695f7cdc589'
  NANODA_REV: '6ae1f0cd962f081f6c423454c5da729d841236a7'
  LANDRUN_REV: '811cfff51ceaf3d9843708aa6d22e9b84ccac8b4'
jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LAKE_LOCK: ${{ runner.temp }}/lean-build.lock
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: '1.85.0'
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned project toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
          check-reservoir-eligibility: false
      - name: Check required administration configuration and fixtures
        run: python3 tools/verify.py --preflight-only
      - name: Set exact Go build environment
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.0'
          cache: false
      - name: Set exact Rust build environment
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Restore exact project artifacts
        id: project-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/build
          key: comparator-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'LatticeProb.lean', 'LatticeProb/**/*.lean', 'LatticeProbAudit/**/*.lean', 'LatticeProbAudit/**/comparator.json', 'tools/**/*.py', '.github/workflows/*.yml', 'README.md', 'formalization.yaml') }}
      - name: Restore exact verification tools
        id: tools-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/tools
          key: comparator-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'tools/**/*.py', '.github/workflows/comparator.yml', 'LatticeProbAudit/**/comparator.json') }}-${{ env.COMPARATOR_REV }}-${{ env.LEAN4EXPORT_REV }}-${{ env.NANODA_REV }}-${{ env.LANDRUN_REV }}-go1.24.0-rust1.85.0
      - name: Build exact verification tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools/bin"
          git clone https://github.com/leanprover/comparator "$HOME/tools/comparator"
          git -C "$HOME/tools/comparator" checkout --detach "$COMPARATOR_REV"
          git clone https://github.com/leanprover/lean4export "$HOME/tools/lean4export"
          git -C "$HOME/tools/lean4export" checkout --detach "$LEAN4EXPORT_REV"
          test "$(cat "$HOME/tools/lean4export/lean-toolchain")" = "$(cat lean-toolchain)"
          (cd "$HOME/tools/comparator" && /usr/bin/flock "$LAKE_LOCK" lake build)
          (cd "$HOME/tools/lean4export" && /usr/bin/flock "$LAKE_LOCK" lake build)
          git clone https://github.com/Zouuup/landrun "$HOME/tools/landrun-src"
          git -C "$HOME/tools/landrun-src" checkout --detach "$LANDRUN_REV"
          (cd "$HOME/tools/landrun-src" && CGO_ENABLED=0 go build -o "$HOME/tools/bin/landrun" ./cmd/landrun)
          git clone https://github.com/ammkrn/nanoda_lib "$HOME/tools/nanoda_lib"
          git -C "$HOME/tools/nanoda_lib" checkout --detach "$NANODA_REV"
          (cd "$HOME/tools/nanoda_lib" && cargo +1.85.0 build --release --locked)
          python3 tools/check_comparators.py --record-tool-build --tool-root "$HOME/tools"
      - name: Verify exact tool identities on cache hit and miss
        run: python3 tools/check_comparators.py --tools-only --tool-root "$HOME/tools"
      - name: Get dependency cache
        run: /usr/bin/flock "$LAKE_LOCK" lake exe cache get
      - name: Run all production gates and every exact comparator pair
        run: python3 tools/verify.py --comparator "$HOME/tools" --evidence-dir "$RUNNER_TEMP/library-comparator"
      - name: Save only successfully verified project artifacts
        if: success() && steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/build
          key: comparator-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'LatticeProb.lean', 'LatticeProb/**/*.lean', 'LatticeProbAudit/**/*.lean', 'LatticeProbAudit/**/comparator.json', 'tools/**/*.py', '.github/workflows/*.yml', 'README.md', 'formalization.yaml') }}
      - name: Save only successfully verified tools
        if: success() && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/tools
          key: comparator-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'tools/**/*.py', '.github/workflows/comparator.yml', 'LatticeProbAudit/**/comparator.json') }}-${{ env.COMPARATOR_REV }}-${{ env.LEAN4EXPORT_REV }}-${{ env.NANODA_REV }}-${{ env.LANDRUN_REV }}-go1.24.0-rust1.85.0
      - name: Upload comparator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: comparator-evidence
          path: ${{ runner.temp }}/library-comparator
          if-no-files-found: error
