  license: "Apache-2.0"

# A library, not the formalization of one source.  Its theorems are standard
# results of probability and potential theory, each cited in its docstring.
# The sources listed are those of the three comparator-audited theorems and
# the three repositories from which modules were adapted (see NOTICE).
sources:
  - title: "The ergodic theory of subadditive stochastic processes"
    authors:
      - "J. F. C. Kingman"
    id: "J. Roy. Statist. Soc. Ser. B 30 (1968)"
    type: "journal article"
    license: ""
    author_contacted: "no"
    prior_work: "Kingman's subadditive ergodic theorem; the library follows Steele's 1989 proof"
  - title: "percolation library (PercolationContinuity), anthropics/formal-math, commit 795efb86"
    authors:
      - "Anthropic, PBC"
    id: "https://github.com/anthropics/formal-math"
    type: "software"
    license: "Apache-2.0"
    author_contacted: "no"
    prior_work: "LatticeProb/Prob/Harris.lean, ZeroOne.lean and HarrisVariants.lean are adapted from it"
  - title: "rotor-23, commit 703754d6"
    authors:
      - "Ahmed Bou-Rabee"
    id: "https://github.com/nitromannitol/rotor-23"
    type: "software"
    license: "Apache-2.0"
    author_contacted: "n/a"     # the same author
    prior_work: "the modules of LatticeProb/Lattice/Planar/ are adapted from it"
  - title: "Parking-Sharpness, commits c368b888 and 27c7f7c2"
    authors:
      - "Ahmed Bou-Rabee"
    id: "https://github.com/nitromannitol/Parking-Sharpness"
    type: "software"
    license: "Apache-2.0"
    author_contacted: "n/a"     # the same author
    prior_work: "sixteen top-level continuum modules of LatticeProb/ are adapted from it"

status:
  scope: >-
    A Lean 4 / Mathlib library of discrete probability and lattice potential
    theory, shared by the formalization repositories Divisible-Sandpile-Percolation,
    Divisible-Sandpile-RWRS, Parking-Sharpness and Unique-Continuation-Planar and
    by formalizations in progress.  It covers simple random walk on Z^d and on
    locally finite graphs (Gaussian kernel bounds, Green functions and their
    gradients, hitting probabilities, the Markov property, exit times, the Nash
    inequality and on-diagonal heat kernel bounds), local central limit
    theorems, electrical networks and the killed Green function, the discrete
    Gaussian free field with zero boundary values, the maximal, pointwise and
    subadditive ergodic theorems and the ergodic decomposition, zero-one laws,
    the Harris, FKG and van den Berg-Kesten inequalities, the Bernstein,
    Freedman, Fuk-Nagaev, von Bahr-Esseen, Poisson-tail, Efron-Stein,
    Paley-Zygmund, Ottaviani, Doob and Pinsker inequalities, the
    Kolmogorov-Chentsov theorem, Brownian motion on R^d and its strong Markov
    property, the isonormal process, regular variation, and Jordan separation
    on the square lattice.  483 modules, about 111,000 lines, 5,112
    declarations.  SCOPE BOUNDARY: five results from the literature are stated
    as propositions in LatticeProb/External/ and not proved (the Gaussian
    logarithmic Sobolev inequality and its Herbst bound, polygonal
    unicoherence, Janiszewski's theorem for polygonal sets, the
    Rellich-Kondrachov embedding in negative Sobolev order); the theorems that
    use them take them as explicit hypotheses.  A sixth proposition there,
    PotentialKernelAsymptotics (Lawler-Limic, Theorems 4.3.1 and 4.4.4), is
    stated for the formalizations that cite it and proved in
    LatticeProb/External/PotentialKernelAsymptoticsProved.lean, and three more,
    FeyMeesterRedigLeastAction (Fey-Meester-Redig, Theorem 2.8),
    CarneVaropoulos (Lyons-Peres, Theorem 13.4) and GreenNorms (Bou-Rabee and
    Panagiotis, Section 3.1), likewise in
    LatticeProb/External/*Proved.lean.  The principal theorems are
    listed in README.md and their axioms printed by
    LatticeProb/Meta/AxiomsAudit.lean; three of them are additionally restated
    over a Mathlib-only vocabulary for the Lean comparator
    (Audit/LatticeProbAudit/).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "LatticeProb.ae_tendsto_div"
      file: "LatticeProb/Prob/Kingman.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/LatticeProbAudit/Kingman/comparator.json"
      literature_dependencies: []
