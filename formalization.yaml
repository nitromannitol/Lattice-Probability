  spend_usd: not tracked (subscription and API accounts)
fidelity:
  divergences: A library states its own theorems, so there is no source text to diverge from.  Where a
    definition divides, truncates or takes a toReal, the theorems that use it carry the hypotheses under
    which it has its intended meaning (for example |j| <= m in the binomial local limit theorem, a vertex
    outside C for the killed Green function).  The five cited results in LatticeProb/External/ are hypotheses
    whose Lean statements render the cited theorems; that they do so faithfully is a reading, not a check.
review:
  status: author-verified
  reviewers:
  - Ahmed Bou-Rabee
  notes: Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no sorry, no custom
    axiom). The statements of the three audited theorems are additionally checked against Mathlib-only
    restatements by Audit/LatticeProbAudit/StatementRegression.lean. This is not external peer review.
alignment:
  namespace: LatticeProb
  statements:
  - source: Kingman's subadditive ergodic theorem (Kingman 1968)
    lean: LatticeProb.ae_tendsto_div
    module: LatticeProb.Prob.Kingman
    status: proved
    note: With LatticeProb.tendsto_integral_div. Comparator challenge Audit/LatticeProbAudit/Kingman/.
  - source: The discrete Gaussian free field with zero boundary values
    lean: LatticeProb.Network.covariance_gff
    module: LatticeProb.Network.GFF
    status: proved
    note: With killedGreenMatrix_posSemidef and integral_gff. Comparator challenge Audit/LatticeProbAudit/GFF/.
  - source: The binomial local central limit theorem with a 1/m error
    lean: LatticeProb.BinomialLCLT.exists_binomPMF_localCLT
    module: LatticeProb.Walk.BinomialLocalCLT
    status: proved
    note: Comparator challenge Audit/LatticeProbAudit/BinomialLocalCLT/.
  - source: 'Lawler-Limic, Random Walk: A Modern Introduction, Theorems 4.3.1 (d >= 3) and 4.4.4 (d =
      2): the Green function and potential kernel asymptotics'
    lean: LatticeProb.External.potentialKernelAsymptotics_holds
    module: LatticeProb.External.PotentialKernelAsymptoticsProved
    status: proved
    note: From LatticeProb.exists_abs_srwGreenInf_sub_le, LatticeProb.tendsto_potentialKernel and LatticeProb.exists_abs_potentialKernel_sub_log_le.
  - source: 'Lawler-Limic, Random Walk: A Modern Introduction, Theorem 2.1.3, Eq. (2.8): the local central
      limit theorem on Z^d with error n^(-(d+2)/2)'
    lean: LatticeProb.LocalCLT.exists_abs_srwHeat_add_succ_sub_le
    module: LatticeProb.Walk.PairedLocalCLT
    status: proved
    note: Parity form LatticeProb.LocalCLT.exists_abs_srwHeat_sub_le; window and d = 4 forms in LatticeProb.Walk.LocalCLTWindow.
  - source: 'Lawler, Intersections of Random Walks, proof of Theorem 3.3.2 with Proposition 3.2.1: the
      second moment of the intersection count of two walks in d >= 5'
    lean: LatticeProb.Intersection.exists_lintegral_interCount_sq_le
    module: LatticeProb.Walk.IntersectionMoment
    status: proved
    note: E_x E_y I(X, Y)^2 <= C (1 + |x - y|)^(4 - d), through the local times and the Green function
      convolution bounds of LatticeProb.Walk.GreenPointwise.
  - source: 'Fey, Meester and Redig, Stabilizability and percolation in the infinite volume sandpile model,
      Ann. Probab. 37 (2009), Theorem 2.8: the least action principle for legal topplings'
    lean: LatticeProb.External.feyMeesterRedigLeastAction_holds
    module: LatticeProb.External.FeyMeesterRedigLeastActionProved
    status: proved
    note: From LatticeProb.Sandpile.le_of_isLegalToppling_of_eventually_eq, for legal toppling procedures
      in discrete time.
  - source: 'Carne (1985), Varopoulos (1985); Lyons-Peres, Probability on Trees and Networks, Theorem
      13.4: the Carne-Varopoulos bound'
    lean: LatticeProb.Graph.walkLaw_eval_le_carneVaropoulos
    module: LatticeProb.Graph.CarneVaropoulos
    status: proved
    note: Heat-kernel form LatticeProb.Graph.heat_le_carneVaropoulos; the proposition LatticeProb.External.CarneVaropoulos
      by LatticeProb.External.carneVaropoulos_holds.
  - source: 'Bou-Rabee and Panagiotis, Section 3.1 (as quoted in parking.tex, eq:green-norms): the l2
      norm and the maximum of the truncated Green function'
    lean: LatticeProb.greenNorms
    module: LatticeProb.Walk.GreenNorms
    status: proved
    note: The proposition LatticeProb.External.GreenNorms by LatticeProb.External.greenNorms_holds.
  - source: The principal theorems listed under Contents in README.md
    lean: LatticeProb.*
    module: LatticeProb.Meta.AxiomsAudit
    status: proved
    note: Axioms printed by LatticeProb/Meta/AxiomsAudit.lean.
  - source: Cited results (Gaussian log-Sobolev and Herbst bound, polygonal unicoherence, Janiszewski,
      Rellich-Kondrachov in negative order)
    lean: LatticeProb.GaussianLogSobolev, LatticeProb.GaussianHerbstBound, LatticeProb.PolygonalUnicoherence,
      LatticeProb.PolygonalJaniszewski, LatticeProb.External.RellichKondrachovNegSobolev
    module: LatticeProb.External
    status: assumed
    note: Explicit hypotheses of the theorems that use them.
acknowledgements: Built on Lean 4, Mathlib, Lake, and leanprover/comparator.  Modules are adapted from
  the percolation library of anthropics/formal-math, from rotor-23 and from Parking-Sharpness (see NOTICE).
