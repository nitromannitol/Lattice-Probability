automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5"
        - "claude-sonnet-5"
        - "claude-opus-5-5"
        - "gpt-6-astra"
        - "glm-5.3"
        - "glm-5.3-flash"
        - "deepseek-v4.1-flash"
        - "labs-leanstral-1-5"
        - "gpt-6-luna"
        - "gpt-5.6-luna"
      framework: >-
        Claude Code (Anthropic) as the supervising and proving harness, which
        wrote most of the Lean code; Codex CLI (OpenAI) for gpt-6-astra; a
        scripted general (glm_general.py) driving glm-5.3, glm-5.3-flash and
        deepseek-v4.1-flash; Mistral Vibe (vibe --agent lean) for Leanstral; the Pi agent
        harness for the deepseek-v4.1-flash workers of the 2026-09-30 campaign
      tool_setup: >-
        Lake builds under leanprover/lean4:v4.32.0 with Mathlib at revision
        81a5d257c8e410db227a6665ed08f64fea08e997, one shared build lock on
        one machine.  The history on main runs from 2026-09-06 (db90208) to
        2026-09-24 (5e998e8); all commits are made under the author's name,
        and the division of labour below is reconstructed from the author's
        run logs and notes, not from commit metadata.  claude-opus-5 (Claude
        Code) wrote most of the library as "Library general" shifts from
        2026-09-06 to 2026-09-08 (sites, i.i.d. fields, the walk modules, BK,
        Kingman, Birkhoff, Kolmogorov-Chentsov, Brownian motion) and as
        further Opus runs on 2026-09-11/12 (the strong Markov property,
        Potter, Karamata, Freedman, the Nash heat kernel bound, Fuk-Nagaev);
        a Claude Code supervising session merged every branch, ran the gates
        and removed references to an unreleased repository (2026-09-18).
        gpt-6-astra (Codex CLI, reasoning high to max) wrote the Gaussian law
        determined by its covariance and Pinsker's inequality (2026-09-11),
        the ergodic decomposition (2026-09-12), ported LatticeProb/Lattice/Planar/
        from rotor-23 (2026-09-12), ran a comparator-style statement audit
        (2026-09-12), and migrated sixteen continuum modules from
        Parking-Sharpness (2026-09-17).  glm-5.3, sampling glm-5.3-flash for
        compile-filtered proof candidates, proved the von Bahr-Esseen
        inequality, the Kolmogorov modulus and moment bounds on product
        spaces and the Fourier form of the heat kernel (2026-09-09 to
        2026-09-11).  deepseek-v4.1-flash, driven by the same script, wrote
        modules on conditional expectations in a parameter, white noise, the
        supremum tail, negative-order Sobolev norms, Liouville's theorem and
        the binomial kernel (2026-09-12 to 2026-09-16).  claude-sonnet-5
        wrote the binomial local central limit theorem with its 1/m error
        (2026-09-16) and moved modules into their own namespaces.
        labs-leanstral-1-5 (Mistral Leanstral, through vibe) wrote the proofs
        of LatticeProb/Network/GFF.lean (2026-09-23, commit 918318e) against
        statements fixed in advance, verified by the supervisor.
        claude-opus-5-5 wrote LatticeProb/Meta/AxiomsAudit.lean, the
        comparator surface Audit/LatticeProbAudit/ and this release
        documentation (2026-09-23).  On 2026-09-23 and 2026-09-24,
        claude-sonnet-5 subagents, supervised by claude-opus-5-5 in Claude
        Code, moved the paper-independent modules listed under Contents in
        README.md as harvested from Divisible-Sandpile-Percolation,
        Divisible-Sandpile-RWRS, Parking-Sharpness, Unique-Continuation-Planar,
        Exploding-Sandpiles, Dynamic-Dimensional-Reduction,
        manhattan-formalization, ORRW-Lower-Bound and rotor-23 into this
        library, one branch per source formalization (harvest-analysis,
        harvest-parking, harvest-manhattan, harvest-orrw,
        harvest-percolation, harvest-sandpile).  Each move was checked by the
        same tools/check_axioms.py and tools/check_warnings.py gates as every
        other merge before the supervising session merged the branch.  These
        modules were not written for this repository; the original
        authorship of each is described in its source repository's own
        disclosure, not restated here.  The author of
        LatticeProb/Walk/LatticeGreen.lean (commit c860b35, 2026-09-23) is
        not recorded in the logs.  Every merge was gated by
        tools/check_axioms.py (the axiom closure of every declaration) and
        tools/check_warnings.py (a warning-free build).  Both
        .github/workflows/build.yml and .github/workflows/comparator.yml
        trigger on request only (workflow_dispatch); the Lean comparator
        (leanprover/comparator) is instead run locally before each release,
        with results recorded in Audit/COMPARATOR_RUNS.md.
        Final pass (2026-09-26 and 2026-09-27): a claude-opus-5-5 general in
        Claude Code dispatched claude-sonnet-5 subagents, which renamed,
        documented and split library modules; gpt-6-luna and gpt-5.6-luna (Codex
        CLI) were commissioned for some proofs.
        On 2026-09-30 a claude-opus-5-5 director in Claude Code proved the
        Green function and planar potential kernel asymptotics
        (LatticeProb/Walk/LineKernel.lean through LatticeProb/Walk/PotentialKernel.lean
        and LatticeProb/External/PotentialKernelAsymptotics*.lean) on the branch
        potential-kernel-asymptotics: it wrote the statements, the route and the
        assembly, and four deepseek-v4.1-flash workers in the Pi agent harness
        proved bounded packets of lemmas against those fixed statements, each
        compiled and byte-checked by the director before it was kept.
      cost:
        wall_time: >-
          about two and a half weeks of calendar time (2026-09-06 to
          2026-09-24), in parallel with the formalizations that use the
          library
        spend_usd: "not tracked (subscription and API accounts)"
        hardware: "a 20-thread Intel i9-9900X / 125 GB RAM Ubuntu machine; GLM and DeepSeek inference on hosted endpoints"
      prompting_notes: >-
        Human-directed agent work, supervised by the author.  Library requests
        came from the formalizations that needed a result; statements were
        written before their proofs were attempted, and proofs were accepted
        only through the axiom and warning gates.
  spend_usd: "not tracked (subscription and API accounts)"
  notes: >-
    All Lean code in this repository was written by the listed models under the
    supervision of the author.  Every proof is checked by the Lean kernel and
    Mathlib; the library contains no sorry and no custom axiom.  The results
    cited from the literature enter as explicit hypotheses, not axioms.  The
    Mathlib-only comparator challenge files (Audit/LatticeProbAudit/*/Challenge.lean)
    each contain exactly one intentional statement-level sorry (the theorem
    body), which is filled by the corresponding Solution.lean.  Three modules
    are adapted from the percolation library of anthropics/formal-math, a
    separate formalization not written for this repository; NOTICE lists them.

fidelity:
  divergences: >-
    A library states its own theorems, so there is no source text to diverge
    from.  Where a definition divides, truncates or takes a toReal, the
    theorems that use it carry the hypotheses under which it has its intended
    meaning (for example |j| <= m in the binomial local limit theorem, a vertex
    outside C for the killed Green function).  The five cited results in
    LatticeProb/External/ are hypotheses whose Lean statements render the
    cited theorems; that they do so faithfully is a reading, not a check.

review:
  status: "author-verified"
  reviewers:
    - "Ahmed Bou-Rabee"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no
    sorry, no custom axiom).  The statements of the three audited theorems are
    additionally checked against Mathlib-only restatements by
    Audit/LatticeProbAudit/StatementRegression.lean.  This is not external
    peer review.

alignment:
  namespace: "LatticeProb"
  statements:
    - source: "Kingman's subadditive ergodic theorem (Kingman 1968)"
      lean: "LatticeProb.ae_tendsto_div"
      module: "LatticeProb.Prob.Kingman"
      status: "proved"
      note: "With LatticeProb.tendsto_integral_div. Comparator challenge Audit/LatticeProbAudit/Kingman/."
    - source: "The discrete Gaussian free field with zero boundary values"
      lean: "LatticeProb.Network.covariance_gff"
      module: "LatticeProb.Network.GFF"
      status: "proved"
      note: "With killedGreenMatrix_posSemidef and integral_gff. Comparator challenge Audit/LatticeProbAudit/GFF/."
    - source: "The binomial local central limit theorem with a 1/m error"
      lean: "LatticeProb.BinomialLCLT.exists_binomPMF_localCLT"
      module: "LatticeProb.Walk.BinomialLocalCLT"
      status: "proved"
      note: "Comparator challenge Audit/LatticeProbAudit/BinomialLocalCLT/."
    - source: "Lawler-Limic, Random Walk: A Modern Introduction, Theorems 4.3.1 (d >= 3) and 4.4.4 (d = 2): the Green function and potential kernel asymptotics"
      lean: "LatticeProb.External.potentialKernelAsymptotics_holds"
      module: "LatticeProb.External.PotentialKernelAsymptoticsProved"
      status: "proved"
      note: "From LatticeProb.exists_abs_srwGreenInf_sub_le, LatticeProb.tendsto_potentialKernel and LatticeProb.exists_abs_potentialKernel_sub_log_le."
    - source: "Lawler-Limic, Random Walk: A Modern Introduction, Theorem 2.1.3, Eq. (2.8): the local central limit theorem on Z^d with error n^(-(d+2)/2)"
      lean: "LatticeProb.LocalCLT.exists_abs_srwHeat_add_succ_sub_le"
      module: "LatticeProb.Walk.PairedLocalCLT"
      status: "proved"
      note: "Parity form LatticeProb.LocalCLT.exists_abs_srwHeat_sub_le; window and d = 4 forms in LatticeProb.Walk.LocalCLTWindow."
    - source: "Lawler, Intersections of Random Walks, proof of Theorem 3.3.2 with Proposition 3.2.1: the second moment of the intersection count of two walks in d >= 5"
      lean: "LatticeProb.Intersection.exists_lintegral_interCount_sq_le"
      module: "LatticeProb.Walk.IntersectionMoment"
      status: "proved"
      note: "E_x E_y I(X, Y)^2 <= C (1 + |x - y|)^(4 - d), through the local times and the Green function convolution bounds of LatticeProb.Walk.GreenPointwise."
    - source: "Fey, Meester and Redig, Stabilizability and percolation in the infinite volume sandpile model, Ann. Probab. 37 (2009), Theorem 2.8: the least action principle for legal topplings"
      lean: "LatticeProb.External.feyMeesterRedigLeastAction_holds"
      module: "LatticeProb.External.FeyMeesterRedigLeastActionProved"
      status: "proved"
      note: "From LatticeProb.Sandpile.le_of_isLegalToppling_of_eventually_eq, for legal toppling procedures in discrete time."
    - source: "Carne (1985), Varopoulos (1985); Lyons-Peres, Probability on Trees and Networks, Theorem 13.4: the Carne-Varopoulos bound"
      lean: "LatticeProb.Graph.walkLaw_eval_le_carneVaropoulos"
      module: "LatticeProb.Graph.CarneVaropoulos"
      status: "proved"
      note: "Heat-kernel form LatticeProb.Graph.heat_le_carneVaropoulos; the proposition LatticeProb.External.CarneVaropoulos by LatticeProb.External.carneVaropoulos_holds."
    - source: "Bou-Rabee and Panagiotis, Section 3.1 (as quoted in parking.tex, eq:green-norms): the l2 norm and the maximum of the truncated Green function"
      lean: "LatticeProb.greenNorms"
      module: "LatticeProb.Walk.GreenNorms"
      status: "proved"
      note: "The proposition LatticeProb.External.GreenNorms by LatticeProb.External.greenNorms_holds."
    - source: "The principal theorems listed under Contents in README.md"
      lean: "LatticeProb.*"
      module: "LatticeProb.Meta.AxiomsAudit"
      status: "proved"
      note: "Axioms printed by LatticeProb/Meta/AxiomsAudit.lean."
    - source: "Cited results (Gaussian log-Sobolev and Herbst bound, polygonal unicoherence, Janiszewski, Rellich-Kondrachov in negative order)"
      lean: "LatticeProb.GaussianLogSobolev, LatticeProb.GaussianHerbstBound, LatticeProb.PolygonalUnicoherence, LatticeProb.PolygonalJaniszewski, LatticeProb.External.RellichKondrachovNegSobolev"
      module: "LatticeProb.External"
      status: "assumed"
      note: "Explicit hypotheses of the theorems that use them."

acknowledgements: >-
  Built on Lean 4, Mathlib, Lake, and leanprover/comparator.  Modules are
  adapted from the percolation library of anthropics/formal-math, from
  rotor-23 and from Parking-Sharpness (see NOTICE).
