version: v0.4
project:
  name: Lattice-Probability
  description: 'A Lean 4/Mathlib library of discrete probability and lattice potential theory: simple
    random walk and Green functions on Z^d and on graphs, local central limit theorems, electrical networks
    and the discrete Gaussian free field, the maximal, pointwise and subadditive ergodic theorems, zero-one
    and correlation inequalities, concentration inequalities, Brownian motion, and planar Jordan separation.
    Shared by the other formalizations in this registry.'
  authors:
  - Ahmed Bou-Rabee
  license: Apache-2.0
