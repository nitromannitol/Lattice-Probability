status:
  scope: 'A Lean 4 / Mathlib library of discrete probability and lattice potential theory, shared by the
    formalization repositories Divisible-Sandpile-Percolation, Divisible-Sandpile-RWRS, Parking-Sharpness
    and Unique-Continuation-Planar and by formalizations in progress. It covers simple random walk on
    Z^d and on locally finite graphs (Gaussian kernel bounds, Green functions and their gradients, hitting
    probabilities, the Markov property, exit times, the Nash inequality and on-diagonal heat kernel bounds),
    local central limit theorems, electrical networks and the killed Green function, the discrete Gaussian
    free field with zero boundary values, the maximal, pointwise and subadditive ergodic theorems and
    the ergodic decomposition, zero-one laws, the Harris, FKG and van den Berg-Kesten inequalities, the
    Bernstein, Freedman, Fuk-Nagaev, von Bahr-Esseen, Poisson-tail, Efron-Stein, Paley-Zygmund, Ottaviani,
    Doob and Pinsker inequalities, the Kolmogorov-Chentsov theorem, Brownian motion on R^d and its strong
    Markov property, the isonormal process, regular variation, and Jordan separation on the square lattice.
    483 modules, about 111,000 lines, 5,112 declarations. SCOPE BOUNDARY: five results from the literature
    are stated as propositions in LatticeProb/External/ and not proved (the Gaussian logarithmic Sobolev
    inequality and its Herbst bound, polygonal unicoherence, Janiszewski''s theorem for polygonal sets,
    the Rellich-Kondrachov embedding in negative Sobolev order); the theorems that use them take them
    as explicit hypotheses. A sixth proposition there, PotentialKernelAsymptotics (Lawler-Limic, Theorems
    4.3.1 and 4.4.4), is stated for the formalizations that cite it and proved in LatticeProb/External/PotentialKernelAsymptoticsProved.lean,
    and three more, FeyMeesterRedigLeastAction (Fey-Meester-Redig, Theorem 2.8), CarneVaropoulos (Lyons-Peres,
    Theorem 13.4) and GreenNorms (Bou-Rabee and Panagiotis, Section 3.1), likewise in LatticeProb/External/*Proved.lean.
    The principal theorems are listed in README.md and their axioms printed by LatticeProb/Meta/AxiomsAudit.lean;
    three of them are additionally restated over a Mathlib-only vocabulary for the Lean comparator (Audit/LatticeProbAudit/).'
